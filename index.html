<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore os sites publicados no GitHub Pages por uma pessoa ou organização.">
  <title>Explorar GitHub Pages</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
    <meta property="og:image" content="https://glauberlasantiago.github.io/VeRepositoriosGithub/capa-compartilhamento.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Explorar GitHub Pages">
    <meta name="twitter:card" content="summary_large_image">
</head>
<body>
  <a class="skip" href="#account">Ir para a busca</a>
  <header class="topbar wrap">
    <div class="brand"><span class="brand-icon" aria-hidden="true">&lt;/&gt;</span> Visualizador de GitHub Pages</div>
    <button type="button" id="theme" class="quiet" aria-pressed="false">Tema escuro</button>
  </header>
  <main class="wrap">
    <section class="hero" aria-labelledby="title">
      <div class="hero-copy">
        <h1 id="title">Explorar GitHub Pages</h1>
        <p>Encontre os sites publicados por uma pessoa ou organização no GitHub.</p>
        <form id="search">
          <label for="account">Perfil do GitHub</label>
          <div class="search-box">
            <span aria-hidden="true">@</span>
            <input id="account" name="perfil" value="GlauberLASantiago" placeholder="Nome de usuário" autocomplete="off" autocapitalize="none" spellcheck="false" required>
            <button class="primary" type="submit">Buscar sites</button>
          </div>
        </form>
      </div>
      <div class="art" aria-hidden="true"><div class="sheet back"></div><div class="sheet middle"></div><div class="sheet front"><b>&lt;/&gt;</b><i></i><i></i></div></div>
    </section>
    <section class="catalog" aria-labelledby="catalog-title">
      <div class="catalog-heading">
        <div><h2 id="catalog-title">Sites publicados</h2><p id="status" role="status"></p></div>
        <a id="profile" class="quiet" target="_blank" rel="noopener noreferrer" hidden>Ver perfil no GitHub</a>
      </div>
      <div class="tools" id="tools" hidden>
        <div class="filter"><label for="filter">Filtrar sites</label><input id="filter" type="search" placeholder="Nome ou descrição"></div>
        <div><label for="order">Ordenar por</label>
          <select id="order">
            <option value="recent">Mais recentes</option><option value="old">Mais antigos</option>
            <option value="az">Nome (A–Z)</option><option value="za">Nome (Z–A)</option>
          </select>
        </div>
        <div class="views" role="group" aria-label="Visualização">
          <button type="button" id="grid" aria-pressed="true">Grade</button>
          <button type="button" id="list" aria-pressed="false">Lista</button>
        </div>
        <button class="quiet" type="button" id="toggle-covers" aria-expanded="false" aria-controls="results cover-filter cover-summary">Exibir capas</button>
        <label class="cover-filter" id="cover-filter" hidden><input type="checkbox" id="missing-only"> Mostrar só os sem capa</label>
      </div>
      <p id="cover-summary" hidden></p>
      <div id="feedback" class="feedback" hidden><p id="message"></p><button class="quiet" id="action" hidden></button></div>
      <div id="results" class="results"></div>
    </section>
  </main>
  <template id="card">
    <article class="card">
      <div class="cover" hidden>
        <span class="cover-symbol" aria-hidden="true">&lt;/&gt;</span>
        <span class="cover-label">Verificando capa…</span>
      </div>
      <div class="card-text">
        <div class="meta"><span class="lang"></span><span class="stars"></span></div>
        <h3><a class="site" target="_blank" rel="noopener noreferrer"></a></h3>
        <p class="description"></p>
      </div>
      <div class="card-foot"><span class="date"></span><a class="code" target="_blank" rel="noopener noreferrer">Ver código</a></div>
    </article>
  </template>
</body>
</html>
